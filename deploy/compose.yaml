name: ${SITE_ID:?required}

services:
  web:
    image: ${WEB_IMAGE:?required}
    user: "101:101"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 64m
    cpus: 0.50
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s