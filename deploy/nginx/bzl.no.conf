server {
    listen 80;
    listen [::]:80;
    server_name bzl.no;
    include /etc/nginx/snippets/site-acme.conf;

    location / {
        return 308 https://www.bzl.no$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bzl.no;
    ssl_certificate /etc/letsencrypt/live/bzl.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bzl.no/privkey.pem;
    include /etc/nginx/snippets/site-tls.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://www.bzl.no$request_uri;
    }
}